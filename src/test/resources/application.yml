# Test-only application.yml
# Lives on test classpath, shadows src/main/resources/application.yml
#
# Per ADR-0005 D1 + ADR-0007 D1: ConfigManager loads this on .load(),
# browser().kind is the dispatch key for BrowserLifecycle factory.

browser:
  kind: OBSCURA
  obscura:
    ws-url: ws://127.0.0.1:9222

retry:
  default:
    maxAttempts: 5
    initialDelayMs: 100

test:
  fixture: test-fixture-value
  nested:
    deep: deep-value
